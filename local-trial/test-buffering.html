<!doctype html><meta charset="utf-8"><title>Viewport buffering checks</title>
<script type="importmap">{"imports":{"three":"./assets/three.module.js"}}</script>
<input id="playbackSpeed" value="1"><p id="weatherDetailStatus"></p><pre id="result">Running…</pre><div id="prepareStatus" hidden></div><button id="retryBuffer" hidden>Retry</button><button id="weatherPlay">Play</button>
<script type="module">
import {WeatherView} from './weather-view.mjs';
const out=document.querySelector('#result'),check=(ok,message)=>{if(!ok)throw Error(message);out.textContent+='\nPASS '+message;};
const pause=ms=>new Promise(r=>setTimeout(r,ms));
try{
 let ready=0,calls=0,failed=0;
 const view={frame:0,current:{frame:0},regionKey:'a',region:{},playing:true,loading:false,context:()=>({preloadStatus:()=>({total:2,ready,failed,terrainFailed:0,coverFailed:failed})}),data:{meta:{times:[0,1,2]},grid:async f=>{calls++;return {frame:f};}},refineWeather:async()=>{},playLabel:WeatherView.prototype.playLabel};
 const loading=WeatherView.prototype.prepare.call(view);await pause(350);
 check(!view.preparing&&view.playing&&view.prepared.grids.size===3,'complete weather allows playback with no terrain ready');
 ready=2;await loading;
 check(!view.preparing&&view.playing,'ready view preserves requested playback');
 check(document.querySelector('#prepareStatus').hidden,'loading indicator closes only when ready');
 view.playing=false;ready=1;
 const zoom=WeatherView.prototype.prepare.call(view);await pause(350);
 check(!view.preparing&&calls===2,'terrain-only refinement does not block playback or reload weather');
 ready=2;await zoom;check(!view.playing,'user-paused forecast remains paused');
 ready=1;failed=1;view.playing=true;
 const recovery=WeatherView.prototype.prepare.call(view);await pause(350);
 check(!view.preparing&&view.playing,'cover failure does not block weather playback');
 check(document.querySelector('#prepareStatus').hidden,'cover failures stay out of main view');
 failed=0;ready=2;await recovery;
 check(document.querySelector('#prepareStatus').hidden&&view.playing,'successful tile retry clears warning automatically');
 // A pending weather frame, unlike terrain, must keep playback waiting.
 view.prepared=null;let release;view.data.grid=()=>new Promise(r=>{release=r;});
 const pending=WeatherView.prototype.prepare.call(view);await pause(10);
 check(view.preparing,'missing weather remains marked as buffering');
 view.prepareId++;release({frame:1});await pending;
 view.prepared={region:'a',grids:new Map([[0,{}],[1,{}],[2,{}]])};
 ready=0;const old=WeatherView.prototype.prepare.call(view);view.prepareId++;view.regionKey='b';view.preparing=true;
 await old;check(view.preparing,'superseded buffer cannot clear a newer loading state');
 view.data.detailGrid=async()=>{throw Error('Detailed tile unavailable');};view.playing=true;
 await WeatherView.prototype.refineWeather.call(view,new Map(),()=>true,{});
 check(view.playing,'failed detail refinement leaves coarse forecast playing');
 check(document.querySelector('#weatherDetailStatus').textContent.includes('global preview'),'detail failure reports usable preview');
 let requested=-1;
 const clock={blend:1,playing:true,loading:false,preparing:true,elapsed:0,frame:0,data:{meta:{times:[0,1,2]}},load(f){requested=f;this.loading=true;},playLabel(){}};
 WeatherView.prototype.advanceTime.call(clock,4);
 check(requested===1&&clock.playing,'Play requests next frame even with incomplete overall buffer');
 WeatherView.prototype.advanceTime.call(clock,4);check(clock.frame===0&&clock.playing,'unavailable next frame holds time without cancelling Play');
 clock.frame=1;clock.loading=false;clock.elapsed=0;WeatherView.prototype.advanceTime.call(clock,4);
 check(requested===2,'next frame resumes after awaited weather becomes available');
 clock.timeTransition=true;clock.blend=0;clock.frame=1;clock.loading=false;clock.playing=true;
 WeatherView.prototype.advanceTime.call(clock,1);check(Math.abs(clock.blend-1/3)<1e-9,'one second advances one forecast hour at 1×');
 clock.playing=false;WeatherView.prototype.advanceTime.call(clock,1);check(Math.abs(clock.blend-1/3)<1e-9,'Pause freezes interpolated weather time');
 clock.playing=true;document.querySelector('#playbackSpeed').value=2;WeatherView.prototype.advanceTime.call(clock,.5);check(Math.abs(clock.blend-2/3)<1e-9,'speed changes preserve progress and accelerate time');
 out.textContent+='\nAll buffering checks passed.';
}catch(e){out.textContent+='\nFAIL '+e.stack;}
</script>
