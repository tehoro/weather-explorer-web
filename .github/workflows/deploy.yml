# Copy any new highlights from the backend and publish the site to GitHub Pages. Converted scenes
# are kept in the Actions cache, so each scene is fetched from the backend once.
#
# The backend asks for a sync as soon as new highlights are ready (repository_dispatch). The
# schedule is the fallback, since GitHub can run scheduled jobs hours late: checks cluster after
# the 10 and 22 UTC sweeps, plus one every three hours for requested events. A check that finds
# nothing new takes about half a minute.
name: Sync and deploy

on:
  schedule:
    - cron: "30,50 10,22 * * *"
    - cron: "20 11,23 * * *"
    - cron: "5 */3 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [highlights-updated]       # sent by the backend when a sweep or requested highlight is ready
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.sync.outputs.changed == 'true' || steps.past.outputs.changed == 'true' }}
      feed: ${{ steps.feed.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Restore converted scenes
        uses: actions/cache/restore@v4
        with:
          path: site/data
          key: data-${{ github.run_id }}
          restore-keys: data-

      - name: Sync from the backend
        id: sync
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
        run: |
          set +e
          uv run --frozen sync.py
          code=$?
          set -e
          if [ "$code" = 0 ]; then echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" = 3 ]; then echo "changed=false" >> "$GITHUB_OUTPUT"
          else exit "$code"; fi

      - name: Save converted scenes
        if: steps.sync.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: site/data
          key: data-${{ github.run_id }}

      - name: Add past events
        id: past
        # Past events (history.py, from ERA5) are kept in the repository, not the cache: they are
        # permanent, and arrive by a push from the private history repository after review. GitHub
        # keeps only the newest queued run, so a push can be dropped for a later scheduled run:
        # deploy whenever the repository's past events differ from the live site's.
        run: |
          rm -rf site/data/history
          if [ -d history ]; then mkdir -p site/data && cp -r history site/data/history; fi
          here=$( [ -f history/index.json ] && sha256sum < history/index.json | cut -c1-64 || true)
          live=$(curl -fsS https://weatherexplorer.neilgordon.me/data/history/index.json 2>/dev/null | sha256sum | cut -c1-64)
          if [ -n "$here" ] && [ "$here" != "$live" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Stamp the release into file names
        if: steps.sync.outputs.changed == 'true' || steps.past.outputs.changed == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          v="${GITHUB_SHA::8}"
          sed -i "s/?v=dev/?v=$v/g" site/index.html site/3d/index.html site/tilt/index.html
          sed -i "s/^const VERSION = \"dev\";/const VERSION = \"$v\";/" site/app.js
          grep -q "?v=$v" site/index.html && grep -q "?v=$v" site/3d/index.html && grep -q "VERSION = \"$v\"" site/app.js

      - name: Note the feed's checksum
        id: feed
        run: echo "sha=$(sha256sum < site/data/feed.json | cut -c1-64)" >> "$GITHUB_OUTPUT"

      - name: Package the site
        if: steps.sync.outputs.changed == 'true' || steps.past.outputs.changed == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # On 10 Nov 2026 Pages reported two deployments as successful but kept serving the old site.
      # Compare the live feed with the one just deployed, and deploy again once if
      # it differs, so a silent failure turns into a failed run instead of a stale site.
      - name: Check the live site
        id: live
        continue-on-error: true
        env:
          WANT: ${{ needs.sync.outputs.feed }}
        run: |
          for i in $(seq 1 20); do
            got=$(curl -fsS "https://weatherexplorer.neilgordon.me/data/feed.json?run=${{ github.run_id }}-$i" | sha256sum | cut -c1-64)
            if [ "$got" = "$WANT" ]; then echo "live site matches"; exit 0; fi
            sleep 30
          done
          echo "::warning::live feed.json still differs after 10 min"; exit 1

      - name: Deploy again
        if: steps.live.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Check the live site again
        if: steps.live.outcome == 'failure'
        env:
          WANT: ${{ needs.sync.outputs.feed }}
        run: |
          for i in $(seq 1 20); do
            got=$(curl -fsS "https://weatherexplorer.neilgordon.me/data/feed.json?run=${{ github.run_id }}-$i" | sha256sum | cut -c1-64)
            if [ "$got" = "$WANT" ]; then echo "live site matches"; exit 0; fi
            sleep 30
          done
          echo "::warning::live feed.json still differs after 10 min"; exit 1

  # 3D views for tropical cyclones (build3d.py). They take minutes per storm to fetch from Open Data,
  # so they are built after the site is live and then deployed again; sync.py only attaches bundles
  # that already exist. Runs after every successful sync, so a storm whose build failed is retried.
  build3d:
    needs: [sync, deploy]
    if: always() && needs.sync.result == 'success' && needs.deploy.result != 'failure'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.build.outputs.changed }}
      feed: ${{ steps.feed.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Restore converted scenes
        uses: actions/cache/restore@v4
        with:
          path: site/data
          key: data-${{ github.run_id }}-3d
          restore-keys: data-

      - name: Build 3D views
        id: build
        run: |
          set +e
          uv run --frozen build3d.py
          code=$?
          set -e
          if [ "$code" = 0 ]; then echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" = 3 ]; then echo "changed=false" >> "$GITHUB_OUTPUT"
          else exit "$code"; fi

      - name: Save converted scenes
        if: steps.build.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: site/data
          key: data-${{ github.run_id }}-3d

      - name: Add past events
        # Past events (history.py, from ERA5) are kept in the repository, not the cache: they are
        # permanent, and arrive by a push from the private history repository after review.
        run: |
          rm -rf site/data/history
          if [ -d history ]; then mkdir -p site/data && cp -r history site/data/history; fi

      - name: Stamp the release into file names
        if: steps.build.outputs.changed == 'true'
        run: |
          v="${GITHUB_SHA::8}"
          sed -i "s/?v=dev/?v=$v/g" site/index.html site/3d/index.html site/tilt/index.html
          sed -i "s/^const VERSION = \"dev\";/const VERSION = \"$v\";/" site/app.js
          grep -q "?v=$v" site/index.html && grep -q "?v=$v" site/3d/index.html && grep -q "VERSION = \"$v\"" site/app.js

      - name: Note the feed's checksum
        id: feed
        run: echo "sha=$(sha256sum < site/data/feed.json | cut -c1-64)" >> "$GITHUB_OUTPUT"

      - name: Package the site
        if: steps.build.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: github-pages-3d

  deploy3d:
    needs: build3d
    if: needs.build3d.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-3d

      # On 10 Nov 2026 Pages reported two deployments as successful but kept serving the old site.
      # Compare the live feed with the one just deployed, and deploy again once if
      # it differs, so a silent failure turns into a failed run instead of a stale site.
      - name: Check the live site
        id: live
        continue-on-error: true
        env:
          WANT: ${{ needs.build3d.outputs.feed }}
        run: |
          for i in $(seq 1 20); do
            got=$(curl -fsS "https://weatherexplorer.neilgordon.me/data/feed.json?run=${{ github.run_id }}-$i" | sha256sum | cut -c1-64)
            if [ "$got" = "$WANT" ]; then echo "live site matches"; exit 0; fi
            sleep 30
          done
          echo "::warning::live feed.json still differs after 10 min"; exit 1

      - name: Deploy again
        if: steps.live.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-3d

      - name: Check the live site again
        if: steps.live.outcome == 'failure'
        env:
          WANT: ${{ needs.build3d.outputs.feed }}
        run: |
          for i in $(seq 1 20); do
            got=$(curl -fsS "https://weatherexplorer.neilgordon.me/data/feed.json?run=${{ github.run_id }}-$i" | sha256sum | cut -c1-64)
            if [ "$got" = "$WANT" ]; then echo "live site matches"; exit 0; fi
            sleep 30
          done
          echo "::warning::live feed.json still differs after 10 min"; exit 1
