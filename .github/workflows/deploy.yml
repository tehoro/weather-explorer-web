# Copy any new highlights from the backend and publish the site to GitHub Pages. Converted scenes
# are kept in the Actions cache, so each scene is fetched from the backend once.
#
# The backend sweeps at 09 and 21 UTC and the new feed appears about 40 minutes later, so checks
# cluster after those times. Requested events can appear at any time, so there is also a check
# every three hours. A check that finds nothing new takes about half a minute.
name: Sync and deploy

on:
  schedule:
    - cron: "45 9,21 * * *"
    - cron: "15,45 10,22 * * *"
    - cron: "5 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Restore converted scenes
        uses: actions/cache/restore@v4
        with:
          path: site/data
          key: data-${{ github.run_id }}
          restore-keys: data-

      - name: Sync from the backend
        id: sync
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
        run: |
          set +e
          uv run --frozen sync.py
          code=$?
          set -e
          if [ "$code" = 0 ]; then echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" = 3 ]; then echo "changed=false" >> "$GITHUB_OUTPUT"
          else exit "$code"; fi

      - name: Save converted scenes
        if: steps.sync.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: site/data
          key: data-${{ github.run_id }}

      - name: Stamp the release into file names
        if: steps.sync.outputs.changed == 'true' || github.event_name != 'schedule'
        run: |
          v="${GITHUB_SHA::8}"
          sed -i "s/?v=dev/?v=$v/g" site/index.html
          sed -i "s/^const VERSION = \"dev\";/const VERSION = \"$v\";/" site/app.js
          grep -q "?v=$v" site/index.html && grep -q "VERSION = \"$v\"" site/app.js

      - name: Package the site
        if: steps.sync.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
